[project]
name = "codigo"
version = "0.1.0"
description = "Continuum robot inverse-kinematics utilities"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0.3",
    "scipy>=1.10.1",
]

[project.optional-dependencies]
# Install only the core dependencies above for headless/Android analysis.
plots = [
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
    "plotly>=6.9.0",
]
ml = [
    "keras>=3.13.1",
    "scikit-learn>=1.3",
    "tensorflow>=2.20.0",
    "typing-extensions>=4.0",
]
notebooks = [
    "jupyter>=1.1.1",
]
hardware = [
    "pyserial>=3.5",
    # "ndicapy",
    "scikit-surgerynditracker",
]
